[project]
name = "novel-rag"
version = "0.1.0"
description = "长篇小说 RAG + 知识图谱中台（P0 骨架）"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "openai>=1.55.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "python-multipart>=0.0.12",
    "charset-normalizer>=3.4.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.20.0",
    "tokenizers>=0.20.0",
    "orjson>=3.10.0",
    "structlog>=24.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    # 只在把历史数据从 Milvus 迁到 pgvector 时用（scripts/migrate_milvus_to_pg.py）；
    # 迁移完成后可以从这里删掉，运行期代码已不再引用
    "pymilvus>=3.0.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
